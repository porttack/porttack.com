{% comment %}
  One-line license notice for original lessons and handouts. Same wording as the
  lesson footer on learn.porttack.com: the author, then the license. The byline
  comes from the site author in the config file.
{% endcomment %}
<footer class="license-notice" style="margin: 2em 0 1em; padding-top: 0.7em; border-top: 1px solid rgba(128,128,128,.35); font-size: 0.9em; color: #57606a;">
  <p style="margin: 0;">By <a href="{{ "/" | relative_url }}">{{ site.author.name }}</a>. Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>.</p>
</footer>
