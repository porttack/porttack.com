---
title: "One Word Rotary Slides"
permalink: /one-word-rotary-slides/
---
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One Word: Service Club Slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #2a7ae2;
    --ink: #1b1f23;
    --paper: #ffffff;
    --muted: #57606a;
    --border: #d0d7de;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #e9edf1;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #root { height: 100%; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .stage-outer {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
    position: relative;
  }

  /* Fixed-size design canvas, scaled to fit via a JS-computed transform --
     lets every slide be authored at generous, fixed pixel sizes ("bigger
     type") without hand-tuning responsive font sizes per breakpoint. */
  .stage {
    width: 1280px;
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.18);
    padding: 80px 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 0 0 auto;
  }

  .stage.ar-16-9 { height: 720px; }
  .stage.ar-4-3 { height: 960px; }

  .kicker {
    font-size: 28px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 18px;
  }

  .slide-title {
    font-size: 64px;
    line-height: 1.1;
    margin: 0 0 40px;
    font-weight: 700;
  }

  .slide-body {
    font-size: 36px;
    line-height: 1.5;
  }

  .slide-body ul {
    margin: 0;
    padding-left: 1.1em;
  }

  .slide-body li {
    margin-bottom: 22px;
  }

  .slide-body li:last-child { margin-bottom: 0; }

  .slide-body a { color: var(--accent); }

  .slide-wide-image {
    display: block;
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    margin: 10px 0 18px;
    border-radius: 8px;
  }

  .depth-nav {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 14px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    z-index: 3;
  }

  .depth-nav.depth-up {
    bottom: auto;
    top: 14px;
  }

  .depth-nav:hover {
    background: rgba(0,0,0,0.75);
  }

  .title-slide {
    text-align: left;
    justify-content: center;
  }

  .title-slide .slide-title {
    font-size: 76px;
    margin-bottom: 16px;
  }

  .title-slide .slide-subtitle {
    font-size: 34px;
    color: var(--muted);
  }

  .highlight-slide {
    background: #fff7e6;
  }

  .highlight-slide .kicker {
    color: #b25e00;
  }

  /* A real, un-curated word list, as many as came in -- wraps freely, no
     fixed count the way every other slide kind keeps to. */
  .wordcloud-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    align-content: flex-start;
    margin-top: 24px;
  }

  .wordcloud-chip {
    background: #f1f3f5;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 24px;
  }

  /* Two candidate word-lists shown side by side, so the room can guess
     which list and which word the next slide reveals. */
  .twolists-wrap {
    display: flex;
    gap: 80px;
    justify-content: center;
    margin-top: 20px;
  }

  .twolists-col { flex: 0 1 380px; }

  .twolists-label {
    font-size: 30px;
    color: var(--muted);
    margin: 0 0 16px;
    text-align: center;
  }

  .twolists-col ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .twolists-col li {
    font-size: 36px;
    text-align: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .twolists-col li:last-child { border-bottom: none; }

  /* One narrowed word, large, center; the four it beat, struck through,
     at the compass points around it. A static end-state snapshot, not an
     animation of the narrowing itself. */
  .radial-wrap {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
  }

  .radial-word {
    position: absolute;
    font-size: 32px;
    font-weight: 600;
    color: #9aa0a6;
    text-decoration: line-through;
  }

  .radial-top { top: 0; left: 50%; transform: translateX(-50%); }
  .radial-bottom { bottom: 0; left: 50%; transform: translateX(-50%); }
  .radial-left { top: 50%; left: 0; transform: translateY(-50%); }
  .radial-right { top: 50%; right: 0; transform: translateY(-50%); }

  .radial-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 56px;
    font-weight: 700;
    color: var(--accent);
    background: #fff;
    border: 3px solid var(--accent);
    border-radius: 16px;
    padding: 20px 48px;
    white-space: nowrap;
  }

  .slide-counter-badge {
    position: absolute;
    bottom: 18px;
    right: 24px;
    font-size: 15px;
    color: var(--muted);
  }

  /* --- Toolbar (not part of the scaled stage, so it stays a readable,
     fixed size regardless of projector distance / zoom level) --- */
  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #1b1f23;
    color: #fff;
    font-size: 14px;
    flex-wrap: wrap;
  }

  .toolbar button {
    background: #333a42;
    color: #fff;
    border: 1px solid #4a545e;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
  }

  .toolbar button:hover { background: #444e58; }
  .toolbar button.active { background: var(--accent); border-color: var(--accent); }
  .toolbar button:disabled { opacity: 0.4; cursor: default; }

  .toolbar .spacer { flex: 1 1 auto; }
  .toolbar .counter { min-width: 4.5em; text-align: center; }
  .toolbar a.back-link { color: #9db8e8; text-decoration: none; font-size: 14px; }
  .toolbar a.back-link:hover { text-decoration: underline; }

  /* --- Speaker notes panel: docked below the stage, plain readable text,
     hidden by default so a mirrored/projected display shows a clean deck. --- */
  .notes-panel {
    flex: 0 0 auto;
    background: #f6f8fa;
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    max-height: 26vh;
    overflow-y: auto;
    font-size: 17px;
    line-height: 1.5;
  }

  .notes-panel h3 {
    margin: 0 0 6px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .click-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    cursor: pointer;
  }
  .click-zone.left { left: 0; }
  .click-zone.right { right: 0; }

  /* --- Outline / print-notes view: a plain scrollable page listing every
     slide with its full speaker notes, meant for printing ahead of class. --- */
  .outline {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    overflow-y: auto;
    height: 100%;
  }

  .outline h1 { margin-bottom: 4px; }
  .outline .outline-sub { color: var(--muted); margin-top: 0; }

  .outline-slide {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin: 20px 0;
    break-inside: avoid;
  }

  .outline-slide h2 {
    margin: 0 0 8px;
    font-size: 22px;
  }

  .outline-slide .outline-bullets {
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 14px;
  }

  .outline-slide .outline-notes {
    font-size: 16px;
    line-height: 1.5;
  }

  .outline-slide .outline-notes p:first-child { margin-top: 0; }

  @media print {
    .toolbar { display: none !important; }
    .outline { height: auto; overflow: visible; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-type="module">
{% raw %}
const { useState, useEffect, useRef, useCallback } = React;

// Edit this array to change the deck. `bullets` is what the room sees on the
// slide (keep it short); `notes` is only ever shown in the notes panel or the
// printable outline, so it can be a full paragraph. A bullet can be a plain
// string, or { text, href } to render as a link.
const SLIDES = [
  {
    kind: "title",
    kicker: "Service Club Version",
    title: "One Word",
    subtitle: "A quick fellowship-building opener",
    notes: "Adapted from a classroom SEL activity. Twelve minutes: brainstorm, narrow to one, write it down, say it out loud. The worksheet carries Rotary's Four-Way Test as a printed compass; it doesn't need its own slide here."
  },
  {
    kind: "bullets",
    kicker: "The activity (12 min)",
    title: "Brainstorm, Then Pick",
    bullets: [
      "Brainstorm (3 min): silently write up to three lists of five words each",
      "Different angles on yourself -- traits, roles, interests, background",
      "Pick a list (30 sec): whichever one feels most interesting right now",
      "Changed your mind? Switching to a different list is fine"
    ],
    notes: "Three lists instead of one gives people more than one honest angle to work from. No wrong choice of list -- and no penalty for switching partway through."
  },
  {
    kind: "bullets",
    kicker: "An example",
    title: "Paul Harris, Rotary's Founder",
    bullets: [
      "Chicago attorney, practicing law for 40 years",
      "Raised by his grandparents in Vermont from age 3",
      "Spent 5 years after law school traveling -- reporter, cowboy, cattle hand",
      "Founded the first Rotary club in 1905 with three friends"
    ],
    notes: "All documented, not a guess at his private inner life -- see Rotary's own history pages and Wikipedia. The next slide shows two honest lists of candidate words; the one after that reveals which word and which list."
  },
  {
    kind: "twolists",
    kicker: "Guess the Word",
    title: "Two Possible Lists",
    listA: ["Tolerance", "Service", "Fellowship", "Vision", "Humility"],
    listB: ["Cowboy", "Traveler", "Playful", "Attorney", "Imaginative"],
    notes: "List A leans civic (the Rotary-values side); List B leans personal (the cowboy-for-a-summer, imaginative-and-playful side -- also real, also documented). Ask the room to guess before advancing: which list, and which word?"
  },
  {
    kind: "radial",
    kicker: "One Answer",
    title: "Paul Harris, Narrowed",
    center: "Fellowship",
    around: ["Tolerance", "Service", "Vision", "Humility"],
    notes: "From List A. Fellowship is the word Harris's own founding story points to most directly -- missing the easy friendships of small-town life was specifically what led him to start the club. Service, Rotary's own later motto (“Service Above Self,” adopted 1950), is a real, honest alternative from the same list -- which is the point: more than one of these could be defended."
  },
  {
    kind: "bullets",
    kicker: "A second example",
    title: "Arch Klumph, Founder of the Foundation",
    bullets: [
      "Cleveland lumber businessman, Rotary Club of Cleveland founding member (1911)",
      "Rotary International president, 1916-17",
      "Proposed an endowment \"for doing good in the world\" at the 1917 convention -- it became The Rotary Foundation",
      "Also an expert flutist, active in organizing Cleveland's own symphony orchestra"
    ],
    notes: "Harris founded the organization in 1905; Klumph, Rotary's president twelve years later, gave it a mechanism -- the Foundation -- to actually fund its work. Verified against Rotary International's own history pages."
  },
  {
    kind: "twolists",
    kicker: "Guess the Word",
    title: "Two Possible Lists",
    listA: ["Generous", "Steward", "Visionary", "Leader", "Philanthropic"],
    listB: ["Lumberman", "Flutist", "Clevelander", "Patron", "Trustee"],
    notes: "List A leans civic (the Foundation-founder side); List B leans personal (the businessman and orchestra patron side -- also real, also documented). Same move as before: ask the room to guess first."
  },
  {
    kind: "radial",
    kicker: "One Answer",
    title: "Arch Klumph, Narrowed",
    center: "Steward",
    around: ["Generous", "Visionary", "Leader", "Philanthropic"],
    notes: "From List A. Visionary only covers the single 1917 proposal; Steward covers the fuller record -- six years as the Foundation's first board chairman, literally managing and overseeing charitable funds on others' behalf, which is what the word means in the first place. Generous or Philanthropic are honest alternatives from the same list."
  },
  {
    kind: "bullets",
    kicker: "A third example",
    title: "Herbert J. Taylor, Wrote the Test",
    bullets: [
      "Chicago businessman, hired in 1932 to rescue Club Aluminum from bankruptcy",
      "Wrote the Four-Way Test for his own employees to use -- it worked",
      "Rotary International director, then president, 1954-55",
      "Also a devout Methodist, active for decades in Christian philanthropy"
    ],
    notes: "The same man who wrote the Four-Way Test printed on the worksheet. Verified against Wikipedia and Rotary's own history pages."
  },
  {
    kind: "twolists",
    kicker: "Guess the Word",
    title: "Two Possible Lists",
    listA: ["Rescuer", "Trustworthy", "Principled", "Reformer", "Ethical"],
    listB: ["Devout", "Entrepreneur", "Veteran", "Philanthropist", "Evangelical"],

  },
  {
    kind: "radial",
    kicker: "One Answer",
    title: "Herbert Taylor, Narrowed",
    center: "Principled",

  },
  {
    kind: "bullets",
    kicker: "The activity, continued",
    title: "Narrow, Write, Share",
    bullets: [
      "Narrow (3 min): cross off one word at a time, five down to one",
      "Write it down (1 min): fold a card into a tent, word facing out",
      "Share (remaining time): go around the room, one word each"
    ],
    notes: "Keep sharing brief -- one word, plus one sentence if the person wants to add it. The point is breadth (hearing from everyone), not depth."
  },
  {
    kind: "highlight",
    kicker: "Before you start",
    title: "Facilitator Notes",
    bullets: [
      "Share your own word first -- it sets the tone and the length others will match",
      "Acknowledge each word simply; no follow-up questions unless invited",
      "Works as a stand-alone opener, not tied to any specific business item"
    ],
    notes: "This is meant to be low-stakes. Don't let it turn into a discussion -- the goal is everyone's voice, briefly, not a deep dive on any one person's word."
  },
  {
    kind: "bullets",
    kicker: "Why it works",
    title: "Rotary's Own Values",
    bullets: [
      "Club Service: strengthening fellowship within the club",
      "Diversity: words rarely repeat, and the range is the point"
    ],
    notes: "This isn't a stretch -- Club Service is literally defined as strengthening fellowship. (The Four-Way Test is on the worksheet, not its own slide here.)"
  },
  {
    kind: "title",
    kicker: "More",
    title: "Full Write-Up",
    bullets: [
      { text: "The service-club version, in full", href: "/one-word-rotary/" },
      { text: "The worksheet, ready to print", href: "/one-word-rotary-worksheet/" },
      { text: "The original classroom lesson plan", href: "/one-word-lesson-plan/" }
    ],
    notes: "Point people here if they want to run this themselves."
  }
];

// A bullet is either a plain string, or { text, href } to render as a link.
function renderBullets(bullets) {
  return (
    <ul>
      {bullets.map((b, i) => (
        <li key={i}>{typeof b === "string" ? b : <a href={b.href}>{b.text}</a>}</li>
      ))}
    </ul>
  );
}

function Stage({ slide, aspect }) {
  const arClass = aspect === "4:3" ? "ar-4-3" : "ar-16-9";
  if (slide.kind === "title") {
    return (
      <div className={"stage title-slide " + arClass}>
        {slide.kicker && <p className="kicker">{slide.kicker}</p>}
        <h1 className="slide-title">{slide.title}</h1>
        {slide.subtitle && <p className="slide-subtitle">{slide.subtitle}</p>}
        {slide.bullets && <div className="slide-body">{renderBullets(slide.bullets)}</div>}
      </div>
    );
  }
  if (slide.kind === "wide") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <img className="slide-wide-image" src={slide.image} alt="" />
        <div className="slide-body">{renderBullets(slide.bullets)}</div>
      </div>
    );
  }
  if (slide.kind === "wordcloud") {
    // Deliberately breaks the "few words per slide" rule every other kind
    // follows -- the point of this one is volume and range, not a short
    // takeaway.
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="wordcloud-wrap">
          {slide.words.map((w, i) => <span className="wordcloud-chip" key={i}>{w}</span>)}
        </div>
      </div>
    );
  }
  if (slide.kind === "twolists") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="twolists-wrap">
          <div className="twolists-col">
            <h2 className="twolists-label">List A</h2>
            <ul>{slide.listA.map((w, i) => <li key={i}>{w}</li>)}</ul>
          </div>
          <div className="twolists-col">
            <h2 className="twolists-label">List B</h2>
            <ul>{slide.listB.map((w, i) => <li key={i}>{w}</li>)}</ul>
          </div>
        </div>
      </div>
    );
  }
  if (slide.kind === "radial") {
    // One narrowed word, large, in the middle; the words it beat arranged
    // around it, struck through. A static snapshot of "after narrowing,"
    // not an animation of the process -- see the commit message for why.
    const positions = ["top", "right", "bottom", "left"];
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="radial-wrap">
          {slide.around.map((w, i) => (
            <div className={"radial-word radial-" + positions[i]} key={i}>{w}</div>
          ))}
          <div className="radial-center">{slide.center}</div>
        </div>
      </div>
    );
  }
  const extraClass = slide.kind === "highlight" ? " highlight-slide" : "";
  return (
    <div className={"stage " + arClass + extraClass}>
      <p className="kicker">{slide.kicker}</p>
      <h1 className="slide-title">{slide.title}</h1>
      <div className="slide-body">{renderBullets(slide.bullets)}</div>
    </div>
  );
}

function ScaledStage({ slide, aspect }) {
  const outerRef = useRef(null);
  const [scale, setScale] = useState(1);
  const designW = 1280;
  const designH = aspect === "4:3" ? 960 : 720;

  useEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    const recompute = () => {
      const rect = el.getBoundingClientRect();
      const s = Math.min((rect.width * 0.98) / designW, (rect.height * 0.98) / designH);
      setScale(s > 0 ? s : 1);
    };
    recompute();
    const ro = new ResizeObserver(recompute);
    ro.observe(el);
    window.addEventListener("resize", recompute);
    return () => { ro.disconnect(); window.removeEventListener("resize", recompute); };
  }, [designH]);

  return (
    <div className="stage-outer" ref={outerRef}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: "center center" }}>
        <Stage slide={slide} aspect={aspect} />
      </div>
    </div>
  );
}

function bulletsToText(bullets) {
  return bullets.map(b => (typeof b === "string" ? b : b.text)).join(" / ");
}

function OutlineCard({ slide, heading }) {
  return (
    <div className="outline-slide">
      <h2>{heading}</h2>
      {slide.bullets && <p className="outline-bullets">On slide: {bulletsToText(slide.bullets)}</p>}
      <div className="outline-notes"><p>{slide.notes}</p></div>
    </div>
  );
}

function Outline() {
  return (
    <div className="outline">
      <h1>One Word: Service Club Version</h1>
      <p className="outline-sub">Speaker notes outline. Print this before class if you'd rather have paper than toggle notes on screen.</p>
      {SLIDES.map((s, i) => (
        <OutlineCard slide={s} heading={`${i + 1}. ${s.title}`} key={i} />
      ))}
    </div>
  );
}

// Deep-linking: ?slide=3 opens on that slide (1-indexed, to match the
// on-screen counter), ?outline=1 opens straight into the speaker-notes
// outline.
function initialStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const slideParam = parseInt(params.get("slide"), 10);
  const index = Number.isInteger(slideParam) ? Math.min(Math.max(slideParam - 1, 0), SLIDES.length - 1) : 0;
  const mode = params.get("outline") ? "outline" : "deck";
  return { index, mode };
}

function App() {
  const initial = initialStateFromUrl();
  const [index, setIndex] = useState(initial.index);
  const [showNotes, setShowNotes] = useState(false);
  const [aspect, setAspect] = useState("16:9");
  const [mode, setMode] = useState(initial.mode); // "deck" | "outline"

  const slide = SLIDES[index];

  const next = useCallback(() => setIndex(i => Math.min(i + 1, SLIDES.length - 1)), []);
  const prev = useCallback(() => setIndex(i => Math.max(i - 1, 0)), []);

  useEffect(() => {
    function onKey(e) {
      if (mode !== "deck") {
        if (e.key === "Escape") setMode("deck");
        return;
      }
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
      else if (e.key === "n" || e.key === "N") setShowNotes(v => !v);
      else if (e.key === "f" || e.key === "F") toggleFullscreen();
      else if (e.key === "o" || e.key === "O") setMode("outline");
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [mode, next, prev]);

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }

  if (mode === "outline") {
    return (
      <div className="app">
        <div className="toolbar">
          <a className="back-link" href="/one-word-rotary/">&larr; One Word: Service Club Version</a>
          <div className="spacer"></div>
          <button onClick={() => setMode("deck")}>Back to slides (Esc)</button>
          <button onClick={() => window.print()}>Print</button>
        </div>
        <Outline />
      </div>
    );
  }

  return (
    <div className="app">
      <div className="stage-outer" style={{ position: "relative" }}>
        <ScaledStage slide={slide} aspect={aspect} />
        <div className="click-zone left" onClick={prev} title="Previous slide"></div>
        <div className="click-zone right" onClick={next} title="Next slide"></div>
        <div className="slide-counter-badge">{index + 1} / {SLIDES.length}</div>
      </div>
      {showNotes && (
        <div className="notes-panel">
          <h3>Speaker notes</h3>
          <p>{slide.notes}</p>
        </div>
      )}
      <div className="toolbar">
        <a className="back-link" href="/one-word-rotary/">&larr; One Word: Service Club Version</a>
        <div className="spacer"></div>
        <button onClick={prev} disabled={index === 0}>&larr; Prev</button>
        <span className="counter">{index + 1} / {SLIDES.length}</span>
        <button onClick={next} disabled={index === SLIDES.length - 1}>Next &rarr;</button>
        <button className={showNotes ? "active" : ""} onClick={() => setShowNotes(v => !v)}>Notes (N)</button>
        <button onClick={() => setMode("outline")}>Print notes (O)</button>
        <button onClick={() => setAspect(a => a === "16:9" ? "4:3" : "16:9")}>{aspect}</button>
        <button onClick={toggleFullscreen}>Fullscreen (F)</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
{% endraw %}
</script>
</body>
</html>
