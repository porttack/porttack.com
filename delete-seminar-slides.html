  @media print {
    .toolbar { display: none !important; }
    .outline { height: auto; overflow: visible; }

// A bullet is either a plain string, or { text, href } to render as a link.
function renderBullets(bullets) {
  return (
    <ul>
      {bullets.map((b, i) => (
        <li key={i}>{typeof b === "string" ? b : <a href={b.href} {...(/^https?:/.test(b.href) ? { target: "_blank", rel: "noopener noreferrer" } : {})}>{b.text}</a>}</li>
      ))}
    </ul>
  );
}

function Stage({ slide, aspect }) {
  const arClass = aspect === "4:3" ? "ar-4-3" : "ar-16-9";
  if (slide.kind === "title") {
    return (
      <div className={"stage title-slide " + arClass}>
        {slide.kicker && <p className="kicker">{slide.kicker}</p>}
        <h1 className="slide-title">{slide.title}</h1>
        {slide.subtitle && <p className="slide-subtitle">{slide.subtitle}</p>}
        {slide.bullets && <div className="slide-body">{renderBullets(slide.bullets)}</div>}
      </div>
    );
  }
  if (slide.kind === "quote") {
    // A provision or a statement shown verbatim, large; type shrinks for
    // longer passages so the whole quote always fits on the stage.
    const len = slide.quote.length;
    const sizeClass = len > 300 ? " quote-xl" : len > 150 ? " quote-lg" : "";
    return (
      <div className={"stage quote-slide " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <blockquote className={"quote-text" + sizeClass}>{"“"}{slide.quote}{"”"}</blockquote>
        <p className="quote-cite">{slide.cite}</p>
      </div>
    );
  }
  if (slide.kind === "wall") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="wall-wrap">
          <div className="wall-side wall-left">{slide.left}</div>
          <div className="wall-side wall-right">{slide.right}</div>
        </div>
      </div>
    );
  }
  if (slide.kind === "blocks") {
    // A three-step picture of what "delete" often does: the entry is
    // marked deleted, the bytes stay, and the space is reused later.
    return (
      <div className={"stage blocks-slide " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        {slide.steps.map((step, i) => (
          <div className="blocks-step" key={i}>
            <div className="blocks-label">{step.label}</div>
            {step.blocks.map((b, j) => (
              <div className={"block block-" + b.state} key={j}>{b.text}</div>
            ))}
          </div>
        ))}
        <p className="blocks-caption">{slide.caption}</p>
      </div>
    );
  }
  if (slide.kind === "section") {
    // A master slide for an optional group of slides that sit under it.
    // The hints tell the presenter how to run or skip the group.
    return (
      <div className={"stage title-slide section-slide " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        {slide.subtitle && <p className="slide-subtitle">{slide.subtitle}</p>}
        {slide.hints && (
          <div className="section-hints">
            {slide.hints.map((h, i) => <span key={i}>{h}</span>)}
          </div>
        )}
      </div>
    );
  }
  if (slide.kind === "wide") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <img className="slide-wide-image" src={slide.image} alt="" />
        <div className="slide-body">{renderBullets(slide.bullets)}</div>
      </div>
    );
  }
  if (slide.kind === "crossoff") {
    // A single list, some words already struck through -- a concrete demo
    // of the narrowing mechanic itself, shown before any reveal so the room
    // sees "crossing off" in action without yet learning the answer.
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <ul className="crossoff-list">
          {slide.list.map((w, i) => (
            <li className={slide.crossedOut.includes(w) ? "crossoff-out" : ""} key={i}>{w}</li>
          ))}
        </ul>
      </div>
    );
  }
  if (slide.kind === "wordcloud") {
    // Deliberately breaks the "few words per slide" rule every other kind
    // follows -- the point of this one is volume and range, not a short
    // takeaway.
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="wordcloud-wrap">
          {slide.words.map((w, i) => <span className="wordcloud-chip" key={i}>{w}</span>)}
        </div>
      </div>
    );
  }
  if (slide.kind === "twolists") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="twolists-wrap">
          <div className="twolists-col">
            <h2 className="twolists-label">List A</h2>
            <ul>{slide.listA.map((w, i) => <li key={i}>{w}</li>)}</ul>
          </div>
          <div className="twolists-col">
            <h2 className="twolists-label">List B</h2>
            <ul>{slide.listB.map((w, i) => <li key={i}>{w}</li>)}</ul>
          </div>
        </div>
      </div>
    );
  }
  if (slide.kind === "radial") {
    // One narrowed word, large, in the middle; the words it beat arranged
    // around it, struck through. A static snapshot of "after narrowing,"
    // not an animation of the process -- see the commit message for why.
    const positions = ["top", "right", "bottom", "left"];
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        {slide.subtitle && <p className="slide-subtitle">{slide.subtitle}</p>}
        <div className="radial-wrap">
          {slide.around.map((w, i) => (
            <div className={"radial-word radial-" + positions[i]} key={i}>{w}</div>
          ))}
          <div className="radial-center">{slide.center}</div>
        </div>
      </div>
    );
  }
  const extraClass = slide.kind === "highlight" ? " highlight-slide" : "";
  return (
    <div className={"stage " + arClass + extraClass}>
      <p className="kicker">{slide.kicker}</p>
      <h1 className="slide-title">{slide.title}</h1>
      <div className="slide-body">{renderBullets(slide.bullets)}</div>
    </div>
  );
}

function ScaledStage({ slide, aspect }) {
  const outerRef = useRef(null);
  const [scale, setScale] = useState(1);
  const designW = 1280;
  const designH = aspect === "4:3" ? 960 : 720;

  useEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    const recompute = () => {
      const rect = el.getBoundingClientRect();
      const s = Math.min((rect.width * 0.98) / designW, (rect.height * 0.98) / designH);
      setScale(s > 0 ? s : 1);
    };
    // Entering/exiting fullscreen can report a stale rect for a frame or
    // two before the browser finishes resizing the viewport, so the
    // ResizeObserver callback that follows sometimes measures too early
    // and leaves the stage scaled for the old (smaller) size with empty
    // space around it. A double rAF waits for that resize to settle.
    const recomputeSoon = () => {
      requestAnimationFrame(() => requestAnimationFrame(recompute));
    };
    recompute();
    const ro = new ResizeObserver(recompute);
    ro.observe(el);
    window.addEventListener("resize", recompute);
    document.addEventListener("fullscreenchange", recomputeSoon);
    return () => {
      ro.disconnect();
      window.removeEventListener("resize", recompute);
      document.removeEventListener("fullscreenchange", recomputeSoon);
    };
  }, [designH]);

  return (
    <div className="stage-outer" ref={outerRef}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: "center center", position: "relative", zIndex: 1, pointerEvents: "none" }}>
        <Stage slide={slide} aspect={aspect} />
      </div>
    </div>
  );
}

function bulletsToText(bullets) {
  return bullets.map(b => (typeof b === "string" ? b : b.text)).join(" / ");
}

function OutlineCard({ slide, heading }) {
  return (
    <div className="outline-slide">
      <h2>{heading}</h2>
      {slide.bullets && <p className="outline-bullets">On slide: {bulletsToText(slide.bullets)}</p>}
      <div className="outline-notes"><p>{slide.notes}</p></div>
    </div>
  );
}

function Outline() {
  return (
    <div className="outline">
      <h1>You Deleted It. Is It Gone?</h1>
      <p className="outline-sub">Speaker notes outline. Print this before class if you'd rather have paper than toggle notes on screen.</p>
      {SLIDES.map((s, i) => (
        <OutlineCard slide={s} heading={`${i + 1}. ${s.title}`} key={i} />
      ))}
    </div>
  );
}

// Deep-linking: ?slide=3 opens on that slide (1-indexed, to match the
// on-screen counter), ?outline=1 opens straight into the speaker-notes
// outline.
function initialStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const slideParam = parseInt(params.get("slide"), 10);
  const index = Number.isInteger(slideParam) ? Math.min(Math.max(slideParam - 1, 0), SLIDES.length - 1) : 0;
  const mode = params.get("outline") ? "outline" : "deck";
  return { index, mode };
}

function App() {
  const initial = initialStateFromUrl();
  const [index, setIndex] = useState(initial.index);
  const [showNotes, setShowNotes] = useState(false);
  const [aspect, setAspect] = useState("16:9");
  const [mode, setMode] = useState(initial.mode); // "deck" | "outline"

  const slide = SLIDES[index];

  const next = useCallback(() => setIndex(i => Math.min(i + 1, SLIDES.length - 1)), []);
  const prev = useCallback(() => setIndex(i => Math.max(i - 1, 0)), []);
  // From any slide in an optional group, jump to the first slide after the group.
  const skipSection = useCallback(() => setIndex(i => { const g = SLIDES[i].group; if (!g) return i; let j = i; while (j < SLIDES.length && SLIDES[j].group === g) j++; return Math.min(j, SLIDES.length - 1); }), []);

  useEffect(() => {
    function onKey(e) {
      if (mode !== "deck") {
        if (e.key === "Escape") setMode("deck");
        return;
      }
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
      else if (e.key === "n" || e.key === "N") setShowNotes(v => !v);
      else if (e.key === "f" || e.key === "F") toggleFullscreen();
      else if (e.key === "o" || e.key === "O") setMode("outline");
      else if (e.key === "s" || e.key === "S") skipSection();
    }
    // Touch: swipe left for the next slide, right for the previous. Swipes
    // that start on a link, button, or video are left alone.
    let touchStart = null;
    function onTouchStart(e) {
      if (mode !== "deck" || e.touches.length !== 1 || e.target.closest("a, button, iframe, input, textarea, select")) { touchStart = null; return; }
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    function onTouchEnd(e) {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) < 50 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
      if (dx < 0) next(); else prev();
    }
    window.addEventListener("keydown", onKey);
    window.addEventListener("touchstart", onTouchStart, { passive: true });
    window.addEventListener("touchend", onTouchEnd, { passive: true });
    return () => {
      window.removeEventListener("keydown", onKey);
      window.removeEventListener("touchstart", onTouchStart);
      window.removeEventListener("touchend", onTouchEnd);
    };
  }, [mode, next, prev, skipSection]);

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }

  if (mode === "outline") {
    return (
      <div className="app">
        <div className="toolbar">
          <a className="back-link" href="/2026/10/22/you-deleted-it-is-it-gone.html">&larr; You Deleted It. Is It Gone?</a>
          <div className="spacer"></div>
          <button onClick={() => setMode("deck")}>Back to slides (Esc)</button>
          <button onClick={() => window.print()}>Print</button>
        </div>
        <Outline />
      </div>
    );
  }

  return (
    <div className="app">
      <div className="stage-outer" style={{ position: "relative" }}>
        <ScaledStage slide={slide} aspect={aspect} />
        <div className="click-zone left" onClick={prev} title="Previous slide"></div>
        <div className="click-zone right" onClick={next} title="Next slide"></div>
        {slide.group && <button className="skip-warmup" onClick={skipSection}>Skip section (S) &rarr;</button>}
        <div className="slide-counter-badge">{index + 1} / {SLIDES.length}</div>
      </div>
      {showNotes && (
        <div className="notes-panel">
          <h3>Speaker notes</h3>
          <p>{slide.notes}</p>
        </div>
      )}
      <div className="toolbar">
        <a className="back-link" href="/2026/10/22/you-deleted-it-is-it-gone.html">&larr; You Deleted It. Is It Gone?</a>
        {slide.handout && <span className="handout-badge">&#128196; {slide.handout}</span>}
        {slide.pause && <span className="pause-badge">&#9208; {slide.pause}</span>}
        <div className="spacer"></div>
        <button onClick={prev} disabled={index === 0}>&larr; Prev</button>
        <span className="counter">{index + 1} / {SLIDES.length}</span>
        <button onClick={next} disabled={index === SLIDES.length - 1}>Next &rarr;</button>
        <button className={showNotes ? "active" : ""} onClick={() => setShowNotes(v => !v)}>Notes (N)</button>
        <button onClick={() => setMode("outline")}>Print notes (O)</button>
        <button onClick={() => setAspect(a => a === "16:9" ? "4:3" : "16:9")}>{aspect}</button>
        <button onClick={toggleFullscreen}>Fullscreen (F)</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
