<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finding Fido (Slides)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #2a7ae2;
    --ink: #1b1f23;
    --paper: #ffffff;
    --muted: #57606a;
    --border: #d0d7de;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #e9edf1;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #root { height: 100%; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .stage-outer {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
    position: relative;
  }

  /* Fixed-size design canvas, scaled to fit via a JS-computed transform --
     lets every slide be authored at generous, fixed pixel sizes ("bigger
     type") without hand-tuning responsive font sizes per breakpoint. */
  .stage {
    width: 1280px;
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.18);
    padding: 80px 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 0 0 auto;
  }

  .stage.ar-16-9 { height: 720px; }
  .stage.ar-4-3 { height: 960px; }

  .kicker {
    font-size: 28px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 18px;
  }

  .slide-title {
    font-size: 64px;
    line-height: 1.1;
    margin: 0 0 40px;
    font-weight: 700;
  }

  .slide-subtitle {
    font-size: 28px;
    color: var(--muted);
    margin: 0 0 20px;
  }

  .slide-body {
    font-size: 36px;
    line-height: 1.5;
  }

  .slide-body ul {
    margin: 0;
    padding-left: 1.1em;
  }

  .slide-body li {
    margin-bottom: 22px;
  }

  .slide-body li:last-child { margin-bottom: 0; }

  .slide-body a { color: var(--accent); }

  .slide-wide-image {
    display: block;
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    margin: 10px 0 18px;
    border-radius: 8px;
  }

  .depth-nav {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 14px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    z-index: 3;
  }

  .depth-nav.depth-up {
    bottom: auto;
    top: 14px;
  }

  .depth-nav:hover {
    background: rgba(0,0,0,0.75);
  }

  .title-slide {
    text-align: left;
    justify-content: center;
  }

  .title-slide .slide-title {
    font-size: 76px;
    margin-bottom: 16px;
  }

  .title-slide .slide-subtitle {
    font-size: 34px;
    color: var(--muted);
  }

  .highlight-slide {
    background: #fff7e6;
  }

  .highlight-slide .kicker {
    color: #b25e00;
  }

  /* A single list with some words already struck through -- the narrowing
     mechanic demoed in place, before any reveal. */
  .crossoff-list {
    list-style: none;
    margin: 30px 0 0;
    padding: 0;
    text-align: center;
  }

  .crossoff-list li {
    font-size: 42px;
    padding: 14px 0;
  }

  .crossoff-list li.crossoff-out {
    color: #9aa0a6;
    text-decoration: line-through;
  }

  /* A real, un-curated word list, as many as came in -- wraps freely, no
     fixed count the way every other slide kind keeps to. */
  .wordcloud-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    align-content: flex-start;
    margin-top: 24px;
  }

  .wordcloud-chip {
    background: #f1f3f5;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 24px;
  }

  /* Two candidate word-lists shown side by side, so the room can guess
     which list and which word the next slide reveals. */
  .twolists-wrap {
    display: flex;
    gap: 80px;
    justify-content: center;
    margin-top: 20px;
  }

  .twolists-col { flex: 0 1 380px; }

  .twolists-label {
    font-size: 30px;
    color: var(--muted);
    margin: 0 0 16px;
    text-align: center;
  }

  .twolists-col ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .twolists-col li {
    font-size: 36px;
    text-align: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .twolists-col li:last-child { border-bottom: none; }

  /* One narrowed word, large, center; the four it beat, struck through,
     at the compass points around it. A static end-state snapshot, not an
     animation of the narrowing itself. */
  .radial-wrap {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
  }

  .radial-word {
    position: absolute;
    font-size: 32px;
    font-weight: 600;
    color: #9aa0a6;
    text-decoration: line-through;
  }

  .radial-top { top: 0; left: 50%; transform: translateX(-50%); }
  .radial-bottom { bottom: 0; left: 50%; transform: translateX(-50%); }
  .radial-left { top: 50%; left: 0; transform: translateY(-50%); }
  .radial-right { top: 50%; right: 0; transform: translateY(-50%); }

  .radial-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 56px;
    font-weight: 700;
    color: var(--accent);
    background: #fff;
    border: 3px solid var(--accent);
    border-radius: 16px;
    padding: 20px 48px;
    white-space: nowrap;
  }

  .quote-slide .slide-title { font-size: 48px; margin-bottom: 24px; }

  .quote-text {
    margin: 0 0 24px;
    padding-left: 36px;
    border-left: 8px solid var(--accent);
    font-size: 44px;
    line-height: 1.35;
  }
  .quote-text.quote-lg { font-size: 34px; }
  .quote-text.quote-xl { font-size: 30px; }

  .quote-cite {
    font-size: 26px;
    color: var(--muted);
    margin: 0;
  }

  /* Temperature check: two walls, students physically stand on the line
     between them. Left wall in the accent color, right wall in the warm one. */
  .wall-wrap {
    display: flex;
    gap: 48px;
    flex: 1 1 auto;
    margin-top: 10px;
    min-height: 0;
  }

  .wall-side {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px;
    font-size: 38px;
    font-weight: 700;
    line-height: 1.25;
    border-radius: 16px;
    border: 5px solid var(--accent);
    color: var(--accent);
  }

  .wall-side.wall-right {
    border-color: #b25e00;
    color: #b25e00;
  }


  .table-slide .slide-title { font-size: 48px; margin-bottom: 22px; }
  .slide-table { width: 100%; border-collapse: collapse; font-size: 28px; line-height: 1.25; }
  .slide-table th, .slide-table td { border: 2px solid var(--ink); padding: 7px 16px; text-align: left; vertical-align: middle; }
  .slide-table th { background: #f1f3f5; font-size: 26px; text-transform: uppercase; letter-spacing: 0.04em; }
  .slide-table .pts { width: 150px; text-align: center; font-weight: 700; }
  .slide-table tr.total td { background: #f1f3f5; font-weight: 700; }
  .video-slide .slide-title { font-size: 40px; margin-bottom: 14px; }
  .video-slide .kicker { margin-bottom: 8px; }
  .video-frame { display: block; width: 768px; height: 432px; margin: 0 auto; border: 0; border-radius: 8px; background: #000; }
  .video-link { display: block; text-align: center; margin-top: 8px; font-size: 20px; color: var(--accent); }
  .timer-group { display: inline-flex; align-items: center; gap: 6px; }
  .timer-readout {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 18px;
    min-width: 4.2em;
    text-align: center;
    padding: 4px 10px;
    border-radius: 6px;
    background: #2b3138;
    border: 1px solid #4a545e;
  }
  .timer-readout.over { background: #b3261e; border-color: #b3261e; }

  /* The timer the room sees: a thick ring with the time inside it. It lives inside
     the scaled slide, so it stays in the slide's top-right corner at any window size.
     Click it to start or pause. */
  .timer-ring { position: absolute; top: 24px; right: 32px; width: 150px; height: 150px; z-index: 20; cursor: pointer; opacity: 0.55; pointer-events: auto; }
  .timer-ring.running, .timer-ring.over { opacity: 1; }
  .timer-ring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: rgba(128, 128, 128, 0.3); stroke-width: 14; }
  .ring-fill { fill: none; stroke: var(--accent); stroke-width: 14; transition: stroke-dashoffset 0.25s linear; }
  .ring-time { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 30px; color: var(--ink); }
  .timer-ring.over .ring-fill { stroke: #b3261e; stroke-dashoffset: 0; }
  .timer-ring.over .ring-time { color: #b3261e; }
  .timer-label { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 6px; white-space: nowrap; font-weight: 700; font-size: 22px; color: var(--ink); }

  /* A red bar along the bottom of the slide where the class stops. It lives inside the scaled slide. */
  .pause-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    background: #b3261e; color: #fff; text-align: center;
    font-weight: 800; font-size: 34px; letter-spacing: 0.12em;
    padding: 14px 0; border-radius: 0 0 12px 12px; pointer-events: none;
  }

  .stage { pointer-events: none; }
  .stage a, .stage button, .stage iframe { pointer-events: auto; }

  .blocks-slide .slide-title { font-size: 48px; margin-bottom: 18px; }

  .blocks-step {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 0 0 14px;
  }

  .blocks-label {
    flex: 0 0 300px;
    font-size: 26px;
    color: var(--muted);
  }

  .block {
    flex: 1 1 0;
    padding: 18px 10px;
    text-align: center;
    font-size: 24px;
    line-height: 1.2;
    border-radius: 10px;
    border: 3px solid var(--accent);
    background: #fff;
  }

  .block.block-marked {
    border-style: dashed;
    border-color: #9aa0a6;
    color: #6b7178;
    background: #f1f3f5;
  }

  .block.block-new {
    border-color: #b25e00;
    color: #b25e00;
  }

  .blocks-caption {
    font-size: 26px;
    color: var(--muted);
    margin: 10px 0 0;
  }

  .section-slide { border-left: 16px solid var(--accent); }
  .section-hints { margin: 36px 0 0; font-size: 30px; color: var(--muted); line-height: 1.7; }
  .section-hints span { display: block; }

  .skip-warmup {
    position: absolute;
    top: 14px;
    right: 18px;
    z-index: 5;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
  }

  .skip-warmup:hover { background: rgba(0,0,0,0.75); }

  .handout-badge {
    background: #2a7ae2;
    color: #fff;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 600;
  }

  .pause-badge {
    background: #b25e00;
    color: #fff;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 600;
  }

  .slide-counter-badge {
    position: absolute;
    bottom: 18px;
    right: 24px;
    font-size: 15px;
    color: var(--muted);
  }

  /* --- Toolbar (not part of the scaled stage, so it stays a readable,
     fixed size regardless of projector distance / zoom level) --- */
  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #1b1f23;
    color: #fff;
    font-size: 14px;
    flex-wrap: wrap;
  }

  .toolbar button {
    background: #333a42;
    color: #fff;
    border: 1px solid #4a545e;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
  }

  .toolbar button:hover { background: #444e58; }
  .toolbar button.active { background: var(--accent); border-color: var(--accent); }
  .toolbar button:disabled { opacity: 0.4; cursor: default; }

  .toolbar .spacer { flex: 1 1 auto; }
  .toolbar .counter { min-width: 4.5em; text-align: center; }
  .toolbar a.back-link { color: #9db8e8; text-decoration: none; font-size: 14px; }
  .toolbar a.back-link:hover { text-decoration: underline; }

  /* --- Speaker notes panel: docked below the stage, plain readable text,
     hidden by default so a mirrored/projected display shows a clean deck. --- */
  .notes-panel {
    flex: 0 0 auto;
    background: #f6f8fa;
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    max-height: 26vh;
    overflow-y: auto;
    font-size: 17px;
    line-height: 1.5;
  }

  .notes-panel h3 {
    margin: 0 0 6px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .click-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    cursor: pointer;
  }
  .click-zone.left { left: 0; }
  .click-zone.right { right: 0; }

  /* --- Outline / print-notes view: a plain scrollable page listing every
     slide with its full speaker notes, meant for printing ahead of class. --- */
  .outline {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    overflow-y: auto;
    height: 100%;
  }

  .outline h1 { margin-bottom: 4px; }
  .outline .outline-sub { color: var(--muted); margin-top: 0; }

  .outline-slide {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin: 20px 0;
    break-inside: avoid;
  }

  .outline-slide h2 {
    margin: 0 0 8px;
    font-size: 22px;
  }

  .outline-slide .outline-bullets {
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 14px;
  }

  .outline-slide .outline-notes {
    font-size: 16px;
    line-height: 1.5;
  }

  .outline-slide .outline-notes p:first-child { margin-top: 0; }

  @media print {
    .toolbar { display: none !important; }
    .outline { height: auto; overflow: visible; }
  }
</style>
</head>

    subtitle: "The essay behind this seminar, and the seminar for AP CSP.",
    bullets: [
      { text: "Finding Fido or Finding You? (essay)", href: "/2026/03/04/finding-fido-or-finding-you.html" },
      { text: "You Deleted It. Is It Gone? (AP CSP seminar)", href: "/2026/10/22/you-deleted-it-is-it-gone.html" }
    ],
    notes: "Optional. Post-class links for students who want more."
  }
];

// A bullet is either a plain string, or { text, href } to render as a link.
function renderBullets(bullets) {
  return (
    <ul>
      {bullets.map((b, i) => (
        <li key={i}>{typeof b === "string" ? b : <a href={b.href} {...(/^https?:/.test(b.href) ? { target: "_blank", rel: "noopener noreferrer" } : {})}>{b.text}</a>}</li>
      ))}
    </ul>
  );
}

const RING_C = 2 * Math.PI * 42;

function formatTimer(sec) {
  const over = sec < 0;
  const a = Math.abs(sec);
  return (over ? "+" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0");
}

function Stage({ slide, aspect }) {
  const arClass = aspect === "4:3" ? "ar-4-3" : "ar-16-9";
  if (slide.kind === "title") {
    return (
      <div className={"stage title-slide " + arClass}>
        {slide.kicker && <p className="kicker">{slide.kicker}</p>}
        <h1 className="slide-title">{slide.title}</h1>
        {slide.subtitle && <p className="slide-subtitle">{slide.subtitle}</p>}
        {slide.bullets && <div className="slide-body">{renderBullets(slide.bullets)}</div>}
      </div>
    );
  }
  if (slide.kind === "table") {
    // A grading table: a label column and a points column, with a total row.
    return (
      <div className={"stage table-slide " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <table className="slide-table">
          <thead>
            <tr><th>{slide.head[0]}</th><th className="pts">{slide.head[1]}</th></tr>
          </thead>
          <tbody>
            {slide.rows.map((r, i) => (
              <tr key={i}><td>{r[0]}</td><td className="pts">{r[1]}</td></tr>
            ))}
            {slide.total && <tr className="total"><td>{slide.total[0]}</td><td className="pts">{slide.total[1]}</td></tr>}
          </tbody>
        </table>
      </div>
    );
  }
  if (slide.kind === "video") {
    return (
      <div className={"stage video-slide " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <iframe
          className="video-frame"
          src={"https://www.youtube.com/embed/" + slide.videoId + "?rel=0"}
          title={slide.title}
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
          allowFullScreen
        ></iframe>
        <a className="video-link" href={slide.videoLink} target="_blank" rel="noopener noreferrer">If the video does not play, open it on YouTube</a>
      </div>
    );
  }
  if (slide.kind === "quote") {
    // A provision or a statement shown verbatim, large; type shrinks for
    // longer passages so the whole quote always fits on the stage.
    const len = slide.quote.length;
    const sizeClass = len > 300 ? " quote-xl" : len > 150 ? " quote-lg" : "";
    return (
      <div className={"stage quote-slide " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <blockquote className={"quote-text" + sizeClass}>{"“"}{slide.quote}{"”"}</blockquote>
        <p className="quote-cite">{slide.cite}</p>
      </div>
    );
  }
  if (slide.kind === "wall") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="wall-wrap">
          <div className="wall-side wall-left">{slide.left}</div>
          <div className="wall-side wall-right">{slide.right}</div>
        </div>
      </div>
    );
  }
  if (slide.kind === "blocks") {
    // A three-step picture of what "delete" often does: the entry is
    // marked deleted, the bytes stay, and the space is reused later.
    return (
      <div className={"stage blocks-slide " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        {slide.steps.map((step, i) => (
          <div className="blocks-step" key={i}>
            <div className="blocks-label">{step.label}</div>
            {step.blocks.map((b, j) => (
              <div className={"block block-" + b.state} key={j}>{b.text}</div>
            ))}
          </div>
        ))}
        <p className="blocks-caption">{slide.caption}</p>
      </div>
    );
  }
  if (slide.kind === "section") {
    // A master slide for an optional group of slides that sit under it.
    // The hints tell the presenter how to run or skip the group.
    return (
      <div className={"stage title-slide section-slide " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        {slide.subtitle && <p className="slide-subtitle">{slide.subtitle}</p>}
        {slide.hints && (
          <div className="section-hints">
            {slide.hints.map((h, i) => <span key={i}>{h}</span>)}
          </div>
        )}
      </div>
    );
  }
  if (slide.kind === "wide") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <img className="slide-wide-image" src={slide.image} alt="" />
        <div className="slide-body">{renderBullets(slide.bullets)}</div>
      </div>
    );
  }
  if (slide.kind === "crossoff") {
    // A single list, some words already struck through -- a concrete demo
    // of the narrowing mechanic itself, shown before any reveal so the room
    // sees "crossing off" in action without yet learning the answer.
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <ul className="crossoff-list">
          {slide.list.map((w, i) => (
            <li className={slide.crossedOut.includes(w) ? "crossoff-out" : ""} key={i}>{w}</li>
          ))}
        </ul>
      </div>
    );
  }
  if (slide.kind === "wordcloud") {
    // Deliberately breaks the "few words per slide" rule every other kind
    // follows -- the point of this one is volume and range, not a short
    // takeaway.
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="wordcloud-wrap">
          {slide.words.map((w, i) => <span className="wordcloud-chip" key={i}>{w}</span>)}
        </div>
      </div>
    );
  }
  if (slide.kind === "twolists") {
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        <div className="twolists-wrap">
          <div className="twolists-col">
            <h2 className="twolists-label">List A</h2>
            <ul>{slide.listA.map((w, i) => <li key={i}>{w}</li>)}</ul>
          </div>
          <div className="twolists-col">
            <h2 className="twolists-label">List B</h2>
            <ul>{slide.listB.map((w, i) => <li key={i}>{w}</li>)}</ul>
          </div>
        </div>
      </div>
    );
  }
  if (slide.kind === "radial") {
    // One narrowed word, large, in the middle; the words it beat arranged
    // around it, struck through. A static snapshot of "after narrowing,"
    // not an animation of the process -- see the commit message for why.
    const positions = ["top", "right", "bottom", "left"];
    return (
      <div className={"stage " + arClass}>
        <p className="kicker">{slide.kicker}</p>
        <h1 className="slide-title">{slide.title}</h1>
        {slide.subtitle && <p className="slide-subtitle">{slide.subtitle}</p>}
        <div className="radial-wrap">
          {slide.around.map((w, i) => (
            <div className={"radial-word radial-" + positions[i]} key={i}>{w}</div>
          ))}
          <div className="radial-center">{slide.center}</div>
        </div>
      </div>
    );
  }
  const extraClass = slide.kind === "highlight" ? " highlight-slide" : "";
  return (
    <div className={"stage " + arClass + extraClass}>
      <p className="kicker">{slide.kicker}</p>
      <h1 className="slide-title">{slide.title}</h1>
      <div className="slide-body">{renderBullets(slide.bullets)}</div>
    </div>
  );
}

function ScaledStage({ slide, aspect, children }) {
  const outerRef = useRef(null);
  const [scale, setScale] = useState(1);
  const designW = 1280;
  const designH = aspect === "4:3" ? 960 : 720;

  useEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    const recompute = () => {
      const rect = el.getBoundingClientRect();
      const s = Math.min((rect.width * 0.98) / designW, (rect.height * 0.98) / designH);
      setScale(s > 0 ? s : 1);
    };
    // Entering/exiting fullscreen can report a stale rect for a frame or
    // two before the browser finishes resizing the viewport, so the
    // ResizeObserver callback that follows sometimes measures too early
    // and leaves the stage scaled for the old (smaller) size with empty
    // space around it. A double rAF waits for that resize to settle.
    const recomputeSoon = () => {
      requestAnimationFrame(() => requestAnimationFrame(recompute));
    };
    recompute();
    const ro = new ResizeObserver(recompute);
    ro.observe(el);
    window.addEventListener("resize", recompute);
    document.addEventListener("fullscreenchange", recomputeSoon);
    return () => {
      ro.disconnect();
      window.removeEventListener("resize", recompute);
      document.removeEventListener("fullscreenchange", recomputeSoon);
    };
  }, [designH]);

  return (
    <div className="stage-outer" ref={outerRef}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: "center center", position: "relative", zIndex: 1, pointerEvents: "none" }}>
        <Stage slide={slide} aspect={aspect} />
        {children}
      </div>
    </div>
  );
}

function bulletsToText(bullets) {
  return bullets.map(b => (typeof b === "string" ? b : b.text)).join(" / ");
}

function OutlineCard({ slide, heading }) {
  return (
    <div className="outline-slide">
      <h2>{heading}</h2>
      {slide.bullets && <p className="outline-bullets">On slide: {bulletsToText(slide.bullets)}</p>}
      <div className="outline-notes"><p>{slide.notes}</p></div>
    </div>
  );
}

function Outline() {
  return (
    <div className="outline">
      <h1>Finding Fido</h1>
      <p className="outline-sub">Speaker notes outline. Print this before class if you'd rather have paper than toggle notes on screen.</p>
      {SLIDES.map((s, i) => (
        <OutlineCard slide={s} heading={`${i + 1}. ${s.title}`} key={i} />
      ))}
    </div>
  );
}

// Deep-linking: ?slide=3 opens on that slide (1-indexed, to match the
// on-screen counter), ?outline=1 opens straight into the speaker-notes
// outline.
function initialStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const slideParam = parseInt(params.get("slide"), 10);
  const index = Number.isInteger(slideParam) ? Math.min(Math.max(slideParam - 1, 0), SLIDES.length - 1) : 0;
  const mode = params.get("outline") ? "outline" : "deck";
  return { index, mode };
}

function App() {
  const initial = initialStateFromUrl();
  const [index, setIndex] = useState(initial.index);
  const [showNotes, setShowNotes] = useState(false);
  const [aspect, setAspect] = useState("16:9");
  const [mode, setMode] = useState(initial.mode); // "deck" | "outline"

  const slide = SLIDES[index];

  // A countdown for the slides that have a `timer` (minutes). It never starts
  // on its own. Past zero it counts up, so a teacher can run over on purpose.
  const [timer, setTimer] = useState({ running: false, left: 0, endAt: 0, has: false, total: 0 });
  useEffect(() => {
    const m = SLIDES[index].timer || 0;
    setTimer({ running: false, left: m * 60, endAt: 0, has: m > 0, total: m * 60 });
  }, [index]);
  useEffect(() => {
    if (!timer.running) return;
    const id = setInterval(() => {
      setTimer(t => (t.running ? { ...t, left: Math.ceil((t.endAt - Date.now()) / 1000) } : t));
    }, 250);
    return () => clearInterval(id);
  }, [timer.running]);
  const toggleTimer = useCallback(() => {
    setTimer(t => {
      if (!t.has) return t;
      return t.running ? { ...t, running: false } : { ...t, running: true, endAt: Date.now() + t.left * 1000 };
    });
  }, []);
  const nudgeTimer = seconds => setTimer(t => ({ ...t, left: t.left + seconds, endAt: t.endAt + seconds * 1000, total: Math.max(t.total, t.left + seconds) }));
  const resetTimer = () => setTimer({ running: false, left: (slide.timer || 0) * 60, endAt: 0, has: !!slide.timer, total: (slide.timer || 0) * 60 });


  const next = useCallback(() => setIndex(i => Math.min(i + 1, SLIDES.length - 1)), []);
  const prev = useCallback(() => setIndex(i => Math.max(i - 1, 0)), []);
  // From any slide in an optional group, jump to the first slide after the group.
  const skipSection = useCallback(() => setIndex(i => { const g = SLIDES[i].group; if (!g) return i; let j = i; while (j < SLIDES.length && SLIDES[j].group === g) j++; return Math.min(j, SLIDES.length - 1); }), []);

  useEffect(() => {
    function onKey(e) {
      if (mode !== "deck") {
        if (e.key === "Escape") setMode("deck");
        return;
      }
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
      else if (e.key === "n" || e.key === "N") setShowNotes(v => !v);
      else if (e.key === "f" || e.key === "F") toggleFullscreen();
      else if (e.key === "o" || e.key === "O") setMode("outline");
      else if (e.key === "s" || e.key === "S") skipSection();
      else if (e.key === "t" || e.key === "T") toggleTimer();
    }
    // Touch: swipe left for the next slide, right for the previous. Swipes
    // that start on a link, button, or video are left alone.
    let touchStart = null;
    function onTouchStart(e) {
      if (mode !== "deck" || e.touches.length !== 1 || e.target.closest("a, button, iframe, input, textarea, select")) { touchStart = null; return; }
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    function onTouchEnd(e) {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) < 50 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
      if (dx < 0) next(); else prev();
    }
    window.addEventListener("keydown", onKey);
    window.addEventListener("touchstart", onTouchStart, { passive: true });
    window.addEventListener("touchend", onTouchEnd, { passive: true });
    return () => {
      window.removeEventListener("keydown", onKey);
      window.removeEventListener("touchstart", onTouchStart);
      window.removeEventListener("touchend", onTouchEnd);
    };
  }, [mode, next, prev, skipSection, toggleTimer]);

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }

  if (mode === "outline") {
    return (
      <div className="app">
        <div className="toolbar">
          <a className="back-link" href="/2026/10/29/finding-fido-seminar.html">&larr; Finding Fido</a>
          <div className="spacer"></div>
          <button onClick={() => setMode("deck")}>Back to slides (Esc)</button>
          <button onClick={() => window.print()}>Print</button>
        </div>
        <Outline />
      </div>
    );
  }

  return (
    <div className="app">
      <div className="stage-outer" style={{ position: "relative" }}>
        <ScaledStage slide={slide} aspect={aspect}>
          {slide.stop && <div className="pause-bar">PAUSE HERE</div>}
          {slide.timer && (
            <div className={"timer-ring" + (timer.left < 0 ? " over" : timer.running ? " running" : "")} onClick={toggleTimer} role="button" aria-label="Start or pause the timer" title="Click to start or pause">
              <svg viewBox="0 0 100 100" aria-hidden="true">
                <circle className="ring-track" cx="50" cy="50" r="42" />
                <circle className="ring-fill" cx="50" cy="50" r="42" strokeDasharray={RING_C} strokeDashoffset={RING_C * (1 - Math.min(1, Math.max(0, timer.total > 0 ? timer.left / timer.total : 0)))} />
              </svg>
              <div className="ring-time">{formatTimer(timer.left)}</div>
              {slide.timerLabel && <div className="timer-label">{slide.timerLabel}</div>}
            </div>
          )}
        </ScaledStage>
        <div className="click-zone left" onClick={prev} title="Previous slide"></div>
        <div className="click-zone right" onClick={next} title="Next slide"></div>
        {slide.group && <button className="skip-warmup" onClick={skipSection}>Skip section (S) &rarr;</button>}
        <div className="slide-counter-badge">{index + 1} / {SLIDES.length}</div>
      </div>
      {showNotes && (
        <div className="notes-panel">
          <h3>Speaker notes</h3>
          <p>{slide.notes}</p>
        </div>
      )}
      <div className="toolbar">
        <a className="back-link" href="/2026/10/29/finding-fido-seminar.html">&larr; Finding Fido</a>
        {slide.handout && <span className="handout-badge">&#128196; {slide.handout}</span>}
        {slide.pause && <span className="pause-badge">&#9208; {slide.pause}</span>}
        {slide.timer && (
          <span className="timer-group">
            <span className={"timer-readout" + (timer.left < 0 ? " over" : "")}>{formatTimer(timer.left)}</span>
            <button onClick={toggleTimer}>{timer.running ? "Pause" : "Start"} (T)</button>
            <button onClick={() => nudgeTimer(-60)} title="One minute less">&minus;1</button>
            <button onClick={() => nudgeTimer(60)} title="One minute more">+1</button>
            <button onClick={resetTimer}>Reset</button>
          </span>
        )}
        <div className="spacer"></div>
        <button onClick={prev} disabled={index === 0}>&larr; Prev</button>
        <span className="counter">{index + 1} / {SLIDES.length}</span>
        <button onClick={next} disabled={index === SLIDES.length - 1}>Next &rarr;</button>
        <button className={showNotes ? "active" : ""} onClick={() => setShowNotes(v => !v)}>Notes (N)</button>
        <button onClick={() => setMode("outline")}>Print notes (O)</button>
        <button onClick={() => setAspect(a => a === "16:9" ? "4:3" : "16:9")}>{aspect}</button>
        <button onClick={toggleFullscreen}>Fullscreen (F)</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
{% endraw %}
</script>
</body>
</html>
